[project]
name = "kec-local-runtime"
version = "0.1.0"
description = "Python runtime for the KEC local interview system"
requires-python = "==3.11.9"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mediapipe>=0.10.20,<1",
  "mlx-whisper>=0.4,<1",
  "numpy>=1.26,<3",
  "onnxruntime>=1.19,<2",
  "pillow>=11,<13",
  "pydantic-settings>=2.6,<3",
  "pymongo>=4.12,<5",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "soundfile>=0.12,<1",
  "silero-vad>=6.0,<7",
  "speechbrain>=1.0,<2",
  "torchaudio>=2.7,<3",
  "uvicorn[standard]>=0.32,<1",
  "kokoro>=0.9.4",
  "misaki[en]>=0.9.4",
  "en-core-web-sm",
]

[project.optional-dependencies]
audio = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.19,<2",
  "soundfile>=0.12,<1",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
kec-api = "kec_runtime.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/kec_runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/kec_runtime/interview_api.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kec_runtime"]
mypy_path = "backend"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
